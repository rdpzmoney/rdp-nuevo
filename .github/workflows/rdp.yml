name: RDP Windows Machine (Auto Node16 + Claude)
on:
  workflow_dispatch:
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350 # Límite de GitHub (6 horas)
    steps:
      - name: Aggressive Cleanup (Free Disk Space)
        run: |
          powercfg -h off
          Remove-Item -Path "C:\Windows\Temp\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "$env:TEMP\*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Windows.old" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Android" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Microsoft SDKs" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\Program Files\Java" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Java*" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "C:\hostedtoolcache\windows\Ruby" -Recurse -Force -ErrorAction SilentlyContinue
          Dism.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase

      - name: Extreme Performance Tweaks
        run: |
          Set-ItemProperty -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\VisualEffects" -Name "VisualFXSetting" -Value 2 -Force
          Set-Service -Name WSearch -StartupType Disabled -ErrorAction SilentlyContinue
          Stop-Service -Name WSearch -Force -ErrorAction SilentlyContinue
          powercfg -setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c

      - name: Install .NET 6, Redis, and Node 16 (Bypass GitHub's Node)
        run: |
          # Instalar Chocolatey
          Set-ExecutionPolicy Bypass -Scope Process -Force
          [System.Net.ServicePointManager]::SecurityProtocol = [System.Net.ServicePointManager]::SecurityProtocol -bor 3072
          iex ((New-Object System.Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
          
          # Instalar .NET 6 y 7zip
          choco install dotnet-6.0-sdk 7zip -y --no-progress
          
          # Descargar e instalar Node.js 16 Portable (Inmune a GitHub)
          Invoke-WebRequest -Uri "https://nodejs.org/dist/v16.20.2/node-v16.20.2-win-x64.zip" -OutFile "C:\node16.zip"
          Expand-Archive -Path "C:\node16.zip" -DestinationPath "C:\" -Force
          Rename-Item -Path "C:\node-v16.20.2-win-x64" -NewName "node16"
          Remove-Item -Path "C:\node16.zip"
          
          # FORZAR a Windows a usar Node 16 SIEMPRE
          [Environment]::SetEnvironmentVariable("Path", "C:\node16;" + [Environment]::GetEnvironmentVariable("Path", "Machine"), "Machine")
          $env:Path = "C:\node16;" + $env:Path
          
          # Descargar e Instalar Redis
          Invoke-WebRequest -Uri "https://github.com/tporadowski/redis/releases/download/v5.0.14.1/Redis-x64-5.0.14.1.zip" -OutFile "C:\Redis.zip"
          Expand-Archive -Path "C:\Redis.zip" -DestinationPath "C:\Redis" -Force
          Set-Location "C:\Redis"
          .\redis-server.exe --service-install redis.windows.conf --loglevel verbose
          Start-Service Redis

      - name: Download Claude Desktop & Setup MCP
        run: |
          # Crear carpetas necesarias en el usuario Skyro
          $userPath = "C:\Users\Skyro"
          New-Item -ItemType Directory -Force -Path "$userPath\Desktop" | Out-Null
          New-Item -ItemType Directory -Force -Path "$userPath\AppData\Roaming\Claude" | Out-Null
          
          # Descargar Claude a tu escritorio
          Invoke-WebRequest -Uri "https://storage.googleapis.com/osprey-downloads-c02f6a0d-347c-492b-a752-3e0651722e97/nest-win-x64/Claude-Setup-x64.exe" -OutFile "$userPath\Desktop\ClaudeSetup.exe"
          
          # Crear el archivo de configuracion MCP automaticamente
          $mcpConfig = @"
          {
            "mcpServers": {
              "filesystem": {
                "command": "npx",
                "args": [
                  "-y",
                  "@modelcontextprotocol/server-filesystem",
                  "C:\\Users\\Skyro\\Desktop\\economy-simulator-main"
                ]
              }
            }
          }
          "@
          $mcpConfig | Out-File -FilePath "$userPath\AppData\Roaming\Claude\claude_desktop_config.json" -Encoding utf8

      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create User
        run: |
          $password = "P@ssw0rd123!"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name "Skyro" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "Skyro"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "Skyro"

      - name: Install Tailscale
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi" -OutFile "$env:TEMP\tailscale.msi"
          Start-Process msiexec.exe -ArgumentList "/i $env:TEMP\tailscale.msi /quiet /norestart" -Wait
          Remove-Item "$env:TEMP\tailscale.msi" -Force

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "Tailscale IP failed"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Keep Alive
        run: |
          Write-Host "=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "User: Skyro | Pass: P@ssw0rd123!"
          Write-Host "Node 16, .NET 6, Redis y Claude listos."
          Write-Host "=================="
          $i = 0
          while ($i -lt 330) { 
              Start-Sleep -Seconds 60
              $i++
          }
